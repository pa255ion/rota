# ld65 layout of the Atari 800XL boot splash (PLAN.md, side track J, step
# 6): an XEX whose segments load the program at $2000 and the first beat's
# screen, player and missile memory and display list in place
# (Rota.A800.Rom, "Memory"). Each segment's header comes from the HDRn
# areas, with addresses from ld65's symbols; RUNAD last.
MEMORY {
    HDR0:  file = %O, start = $0000, size = 2;
    HDR1:  file = %O, start = $0000, size = 4;
    MAIN:  file = %O, start = $2000, size = $6000, define = yes;
    HDR2:  file = %O, start = $0000, size = 4;
    SCR1:  file = %O, start = $8000, size = 3840, define = yes;
    HDR3:  file = %O, start = $0000, size = 4;
    SCR2:  file = %O, start = $9000, size = 3840, define = yes;
    HDR4:  file = %O, start = $0000, size = 4;
    PM:    file = %O, start = $A300, size = $500, define = yes;
    HDR5:  file = %O, start = $0000, size = 4;
    DL:    file = %O, start = $A800, size = $100, define = yes;
    RUN:   file = %O, start = $0000, size = 6;
    ZP:    file = "", start = $0080, size = $80;
    BSS:   file = "", start = $A900, size = $700;
}
SEGMENTS {
    XEXMARK:  load = HDR0, type = ro;
    XEXHDR1:  load = HDR1, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    XEXHDR2:  load = HDR2, type = ro;
    SCREEN1:  load = SCR1, type = ro;
    XEXHDR3:  load = HDR3, type = ro;
    SCREEN2:  load = SCR2, type = ro;
    XEXHDR4:  load = HDR4, type = ro;
    PMSTATIC: load = PM,   type = ro;
    XEXHDR5:  load = HDR5, type = ro;
    DLIST:    load = DL,   type = ro;
    XEXRUN:   load = RUN,  type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = BSS,  type = bss;
}
