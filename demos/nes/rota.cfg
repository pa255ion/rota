# ld65 layout of the NES boot splash (PLAN.md, side track J, step 3): an
# iNES file with UxROM (mapper 2): bank 0 at $8000 (the streams and the
# fabric's step code; selected at reset and never switched), the fixed
# bank at $C000 (code, tiles, the nametable, vectors); CHR RAM.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = PRG0,   type = ro;
    CODE:     load = PRG1,   type = ro;
    RODATA:   load = PRG1,   type = ro;
    VECTORS:  load = PRG1,   type = ro, start = $FFFA;
}
