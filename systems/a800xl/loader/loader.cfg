# ld65 layout of the XEX loader page (xexload.s): $D500-$D5EE code, the RTS
# that serves as the stub cartridge's init routine at $D5EF; $D5F0-$D5FF
# are the port's (filled with $FF in the image).
MEMORY {
    PAGE: file = %O, start = $D500, size = $EF, fill = yes, fillval = $FF;
    RTS:  file = %O, start = $D5EF, size = 1;
    REGS: file = %O, start = $D5F0, size = $10, fill = yes, fillval = $FF;
}
SEGMENTS {
    LOADER: load = PAGE, type = ro;
    LDRRTS: load = RTS,  type = ro;
}
