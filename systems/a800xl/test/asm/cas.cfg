# ld65 layout of our cassette boot programs (make a800-asm; side track Q):
# one raw block loaded by the OS's cassette boot at $3000, its boot header
# first (cas_boot.s); a800-cas turns it into tape records (.cas).
MEMORY {
    MAIN: file = %O, start = $3000, size = $4000;
}
SEGMENTS {
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro, optional = yes;
}
