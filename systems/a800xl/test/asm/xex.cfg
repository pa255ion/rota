# ld65 layout of our XEX regression programs (make a800-asm): one segment
# at $2000 (CODE, RODATA), then RUNAD. The headers come from the XEXHDR
# and XEXRUN segments (xex.inc), with addresses from ld65's symbols.
MEMORY {
    HDR:  file = %O, start = $0000, size = 6;
    MAIN: file = %O, start = $2000, size = $8000, define = yes;
    RUN:  file = %O, start = $0000, size = 6;
}
SEGMENTS {
    XEXHDR: load = HDR,  type = ro;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro, optional = yes;
    XEXRUN: load = RUN,  type = ro;
}
