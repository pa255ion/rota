# ld65 layout of our 32 KiB XEGS cartridges (make a800-asm; side track Q,
# Q.7): banks 0 to 2 for the window at $8000-$9FFF, then bank 3, the last,
# fixed at $A000-$BFFF with the code and the cartridge header. The Makefile
# puts the .car header (type 12) in front.
MEMORY {
    B0:  file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B1:  file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:  file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    ROM: file = %O, start = $A000, size = $1FF0, fill = yes, fillval = $FF;
    MRK: file = %O, start = $BFF0, size = $000A, fill = yes, fillval = $FF;
    HDR: file = %O, start = $BFFA, size = 6;
}
SEGMENTS {
    BANK0:   load = B0, type = ro;
    BANK1:   load = B1, type = ro;
    BANK2:   load = B2, type = ro;
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro, optional = yes;
    MARK:    load = MRK, type = ro;
    CARTHDR: load = HDR, type = ro;
}
