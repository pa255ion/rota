# ld65 layout of our 8 KiB cartridges (make a800-asm): $A000-$BFFF, the
# cartridge header in its last 6 bytes (CARTHDR).
MEMORY {
    ROM: file = %O, start = $A000, size = $1FFA, fill = yes, fillval = $FF;
    HDR: file = %O, start = $BFFA, size = 6;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro, optional = yes;
    CARTHDR: load = HDR, type = ro;
}
