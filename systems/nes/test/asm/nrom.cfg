# ld65 layout of our NES regression ROMs (CLAUDE.md rule 5): an iNES file
# with NROM-128 (16 KiB PRG at $C000, mirrored at $8000) and 8 KiB CHR ROM.
# PRG RAM at $6000 holds Blargg's result protocol (docs/systems/nes.md).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0200, size = $0600, type = rw, file = "";
    SRAM:   start = $6000, size = $2000, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:    start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
    SRAM:     load = SRAM,   type = bss, optional = yes;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro, optional = yes;
    VECTORS:  load = PRG,    type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro, optional = yes;
}
