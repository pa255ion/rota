# ld65 layout of mmc5.s (side track D): an iNES file with MMC5 (mapper 5),
# 64 KiB PRG as eight 8 KiB banks (bank n starts with the byte $A0 + n;
# the code in the last, at $E000) and 16 KiB CHR as sixteen 1 KiB banks
# (bank n starts with $C0 + n). PRG RAM at $6000 holds Blargg's result
# protocol once the test has unlocked it.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0200, size = $0600, type = rw, file = "";
    SRAM:   start = $6000, size = $2000, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $4000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, optional = yes;
    SRAM:     load = SRAM,   type = bss, optional = yes;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = PRG0,   type = ro;
    BANK1:    load = PRG1,   type = ro;
    BANK2:    load = PRG2,   type = ro;
    BANK3:    load = PRG3,   type = ro;
    BANK4:    load = PRG4,   type = ro;
    BANK5:    load = PRG5,   type = ro;
    BANK6:    load = PRG6,   type = ro;
    CODE:     load = PRG7,   type = ro;
    RODATA:   load = PRG7,   type = ro, optional = yes;
    VECTORS:  load = PRG7,   type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
